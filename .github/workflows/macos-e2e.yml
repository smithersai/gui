# macos-e2e.yml — full-stack XCUITest harness for the SmithersGUI macOS app.
#
# Ticket: macos-e2e-harness. Mirrors `ios-e2e.yml` but runs against the
# native macOS destination instead of the iOS Simulator. No iOS-simulator
# boot is required.
#
# Gating: expensive (~10-15 min) because it spins the full plue stack,
# so it runs only on push-to-main and on PRs that explicitly target
# main. Contributors can run it locally via `macos/scripts/run-e2e.sh`.

name: macOS E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The harness clones the private smithersai/plue repository, so it needs
  # the PLUE_CHECKOUT_TOKEN secret. Without it the E2E job is skipped, not
  # failed. Enabling it also needs a runner with Docker: GitHub's arm64
  # macOS runners have no nested virtualization, so
  # docker/setup-docker-action cannot start a VM there.
  preflight:
    name: Check E2E prerequisites
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          PLUE_CHECKOUT_TOKEN: ${{ secrets.PLUE_CHECKOUT_TOKEN }}
        run: |
          if [ -n "${PLUE_CHECKOUT_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PLUE_CHECKOUT_TOKEN is not set; skipping the macOS E2E harness."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  macos-e2e:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    name: macOS E2E (platform=macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout gui
        uses: actions/checkout@v4
        with:
          path: gui

      - name: Checkout plue
        uses: actions/checkout@v4
        with:
          repository: smithersai/plue
          path: plue
          token: ${{ secrets.PLUE_CHECKOUT_TOKEN }}
          persist-credentials: false

      - name: Install Xcode toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install libpq (psql for seed script)
        run: brew install libpq

      - name: Set up Docker (macOS)
        uses: docker/setup-docker-action@v4

      - name: Install Bun (for plue workflow-runtime build)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Pre-warm plue bun.lock
        working-directory: plue
        run: bun install || true

      - name: Run macOS E2E harness
        working-directory: gui
        env:
          PLUE_CHECKOUT: ${{ github.workspace }}/plue
          PLUE_BASE_URL: http://localhost:4000
          # macOS builds DO NOT need the iOS-specific env scrub
          # (SDKROOT / LIBRARY_PATH / RUSTFLAGS). Hosted runner env is
          # clean; the harness script runs with full shell env intact.
        run: ./macos/scripts/run-e2e.sh

      - name: Collect xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-e2e-xcresult
          path: gui/build/macos-e2e-results-*.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Collect xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-e2e-xcodebuild-log
          path: gui/build/macos-e2e-xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
