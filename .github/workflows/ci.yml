# CI for SmithersGUI (ticket 0121).
#
# Builds both the macOS app and the iOS app on every push/PR so the
# cross-platform matrix is exercised continuously. The iOS jobs are the
# part that did not exist before this ticket; the macOS job replaces the
# previously ad-hoc local-only `zig build xcode` path.
#
# Downstream tickets add:
#   0123: libghostty iOS artifact build + linking
#   0124: libsmithers-core iOS static archive build + linking
#   0125: code signing + release upload
#
# 0123/0124 have landed: the iOS target links ghostty-vt.xcframework and
# libsmithers-ios.xcframework, so the iOS jobs build both with Zig first.
#
# The Xcode jobs run on macos-26 with Xcode 26.3 (GitHub retired macos-14
# on 2026-11-02). Since 2026-04-28 App Store Connect accepts only uploads
# built with Xcode 26 and the iOS 26 SDK
# (https://developer.apple.com/news/upcoming-requirements/), and 26.3 is the
# Xcode the pinned ghostty submodule's own CI uses.

name: CI

on:
  push:
    branches: [main, "initiative/*"]
  pull_request:
    branches: [main, "initiative/*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # XcodeGen reads project.yml. The xcodegen-check job compares its output
  # byte for byte, so every job installs this exact release, not brew's.
  XCODEGEN_VERSION: "2.43.0"
  XCODE_VERSION: "26.3"

jobs:
  # ---------------------------------------------------------------------------
  # Smithers 1.0 dogfooding: `smthrs ci //...` runs every PACKAGE.ts target
  # this Linux host supports: libsmithers build, tests, build-script tests and
  # zig fmt (//libsmithers), repository hygiene, workflow helper tests, and the
  # factory projection check (//.smithers). //Shared:test is darwin-only and
  # exclusive, so the wildcard omits it here; run it on a Mac with
  # `smthrs test //Shared:test`. Results replay from .smithers/cache (kept by
  # actions/cache) and sync through build.smithers.sh when the tokens are set.
  # ---------------------------------------------------------------------------
  smthrs-ci:
    name: smthrs ci //...
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SMTHRS_VERSION: "1.0.0-rc.18"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install SQLite development files (libsmithers links sqlite3)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libsqlite3-dev
      - name: Restore the smthrs result and Zig caches
        uses: actions/cache@v4
        with:
          path: .smithers/cache
          key: smthrs-${{ runner.os }}-${{ github.sha }}
          restore-keys: smthrs-${{ runner.os }}-
      - name: smthrs ci //...
        run: npx --yes --package="@smthrs/cli@${SMTHRS_VERSION}" smthrs ci '//...' --verbose
        env:
          SMITHERS_CACHE_READ_TOKEN: ${{ secrets.SMITHERS_CACHE_READ_TOKEN }}
          # Only pushes to main publish to the shared cache; pull requests read.
          SMITHERS_CACHE_WRITE_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SMITHERS_CACHE_WRITE_TOKEN || '' }}

  # ---------------------------------------------------------------------------
  # Regenerate the Xcode project and fail if project.yml drifted out of sync
  # with the tracked .xcodeproj. Cheap sanity gate that runs before the heavy
  # build jobs.
  # ---------------------------------------------------------------------------
  xcodegen-check:
    name: XcodeGen regenerate
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install XcodeGen (pinned)
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o "${RUNNER_TEMP}/xcodegen.zip"
          unzip -q "${RUNNER_TEMP}/xcodegen.zip" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Regenerate project
        run: xcodegen generate
      - name: Verify .xcodeproj is in sync
        run: |
          # The generated xcodeproj is expected to be committed. If it differs
          # from the checked-in version, fail — developer forgot to regenerate.
          if ! git diff --quiet -- SmithersGUI.xcodeproj; then
            echo "::error::SmithersGUI.xcodeproj is out of sync with project.yml."
            echo "::error::Run 'xcodegen generate' and commit the result."
            git --no-pager diff --stat -- SmithersGUI.xcodeproj
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # macOS app + tests. Uses the zig build shim so libsmithers + libghostty
  # are built first (matching local developer flow).
  # ---------------------------------------------------------------------------
  macos-build:
    name: macOS build & test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      # Xcode 26 ships the Metal compiler as a separate component; the
      # GhosttyKit build compiles Ghostty's shaders with `xcrun metal`.
      - name: Ensure the Metal toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Install XcodeGen (pinned)
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o "${RUNNER_TEMP}/xcodegen.zip"
          unzip -q "${RUNNER_TEMP}/xcodegen.zip" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Resolve GhosttyKit cache key
        id: ghostty_cache_key
        run: |
          set -euo pipefail
          GHOSTTY_SHA="$(git -C ghostty rev-parse HEAD)"
          BUILD_HASH="$(shasum -a 256 build.zig | cut -d' ' -f1)"
          echo "key=ghosttykit-macos-${XCODE_VERSION}-$(cat .zigversion)-${GHOSTTY_SHA}-${BUILD_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore GhosttyKit.xcframework cache
        id: ghostty_cache
        uses: actions/cache@v4
        with:
          path: ghostty/macos/GhosttyKit.xcframework
          key: ${{ steps.ghostty_cache_key.outputs.key }}
      - name: Build libsmithers
        run: zig build libsmithers
      - name: Build GhosttyKit.xcframework
        if: steps.ghostty_cache.outputs.cache-hit != 'true'
        run: zig build ghostty
      - name: Regenerate Xcode project
        run: xcodegen generate
      - name: Build SmithersGUI (macOS)
        run: |
          xcodebuild \
            -project SmithersGUI.xcodeproj \
            -scheme SmithersGUI \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Unit tests (macOS)
        run: |
          xcodebuild \
            -project SmithersGUI.xcodeproj \
            -scheme SmithersGUI \
            -destination 'platform=macOS' \
            -configuration Debug \
            -resultBundlePath build/macos-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test
      # The result bundle holds each UI test's screenshots and accessibility
      # snapshots; open it in Xcode to see the app state at a failure.
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-tests-xcresult
          path: build/macos-tests.xcresult
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # iOS simulator app + tests. Builds the libghostty-vt and libsmithers iOS
  # xcframeworks first (tickets 0123/0124).
  # ---------------------------------------------------------------------------
  ios-simulator-build:
    name: iOS simulator build & test
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Xcode 26.3's iOS 26.2 runtime on macos-26 offers iPhone 17.
      IOS_SIMULATOR: iPhone 17
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Install XcodeGen (pinned)
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o "${RUNNER_TEMP}/xcodegen.zip"
          unzip -q "${RUNNER_TEMP}/xcodegen.zip" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "$GITHUB_PATH"
      # project.yml links ghostty/zig-out/lib/ghostty-vt.xcframework and
      # libsmithers/zig-out/lib/libsmithers-ios.xcframework into SmithersiOS.
      # Both are build outputs, so build them (or restore them) first. The
      # cache keys match ios-testflight.yml.
      - name: Resolve iOS xcframework cache keys
        id: ios_cache_keys
        run: |
          set -euo pipefail
          ZIG_VERSION="$(cat .zigversion)"
          GHOSTTY_SHA="$(git -C ghostty rev-parse HEAD)"
          SCRIPT_HASH="$(shasum -a 256 poc/libghostty-ios/scripts/build-xcframework.sh | cut -d' ' -f1)"
          SRC_HASH="$(find libsmithers -type f \( -name '*.zig' -o -name '*.zon' -o -name '*.h' -o -path 'libsmithers/scripts/*' \) -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 shasum -a 256 \
            | shasum -a 256 \
            | cut -d' ' -f1)"
          echo "ghostty=ghostty-vt-xcframework-${ZIG_VERSION}-${GHOSTTY_SHA}-${SCRIPT_HASH}-xcode${XCODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "libsmithers=libsmithers-ios-xcframework-${ZIG_VERSION}-${SRC_HASH}-xcode${XCODE_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Restore ghostty-vt.xcframework cache
        id: ghostty_cache
        uses: actions/cache@v4
        with:
          path: ghostty/zig-out
          key: ${{ steps.ios_cache_keys.outputs.ghostty }}
      - name: Restore libsmithers-ios.xcframework cache
        id: libsmithers_cache
        uses: actions/cache@v4
        with:
          path: libsmithers/zig-out/lib/libsmithers-ios.xcframework
          key: ${{ steps.ios_cache_keys.outputs.libsmithers }}
      - name: Install Zig (pinned)
        if: steps.ghostty_cache.outputs.cache-hit != 'true' || steps.libsmithers_cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      # The universal ghostty build also emits GhosttyKit, which compiles
      # Ghostty's shaders; Xcode 26 ships the Metal compiler separately.
      - name: Ensure the Metal toolchain
        if: steps.ghostty_cache.outputs.cache-hit != 'true'
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Build ghostty-vt.xcframework
        if: steps.ghostty_cache.outputs.cache-hit != 'true'
        run: ./poc/libghostty-ios/scripts/build-xcframework.sh
      - name: Build libsmithers-ios.xcframework
        if: steps.libsmithers_cache.outputs.cache-hit != 'true'
        run: ./libsmithers/scripts/build-ios-xcframework.sh
      - name: Regenerate Xcode project
        run: xcodegen generate
      - name: Show available iOS simulators
        run: xcrun simctl list devices available | grep -E "iPhone" | head -20
      - name: Build SmithersiOS (simulator)
        run: |
          xcodebuild \
            -project SmithersGUI.xcodeproj \
            -scheme SmithersiOS \
            -destination "platform=iOS Simulator,name=${IOS_SIMULATOR}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run iOS unit + UI tests (simulator)
        run: |
          xcodebuild \
            -project SmithersGUI.xcodeproj \
            -scheme SmithersiOS \
            -destination "platform=iOS Simulator,name=${IOS_SIMULATOR}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test

  # ---------------------------------------------------------------------------
  # Android core canary (ticket 0104).
  #
  # Builds `libsmithers_core.so` for `aarch64-linux-android` via Zig and
  # then assembles the minimal Kotlin app under `poc/android-core/` via
  # the Android Gradle Plugin. This is a CONTINUOUS BUILD CANARY — it
  # exists to fail loudly when a Stage-0/1 change forecloses Android
  # compilation. Required, not advisory: a failure here blocks the PR.
  #
  # No emulator run: spec accepts build-only in CI (emulator runs are
  # dev-local). Runtime smoke is documented in poc/android-core/README.md.
  #
  # NDK version is pinned via the Android SDK manager invocation; bumping
  # it is a real code review event (it can change libc symbols the Zig
  # core links against).
  # ---------------------------------------------------------------------------
  android-core-canary:
    name: Android core canary (build-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_NDK_VERSION: "26.3.11579264"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        # v3 installs the removed `tools` package and fails; v4 installs
        # only platform-tools by default. The pinned components are
        # installed explicitly below so the NDK version is auditable here.
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install pinned NDK + platforms
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Matches gradle/wrapper/gradle-wrapper.properties; AGP 8.4 needs
          # Gradle 8.6 or later within 8.x.
          gradle-version: "8.7"
      - name: Zig cross-compile sanity check (aarch64-linux-android)
        # Independent verification that the Zig source cross-compiles
        # even before Gradle orchestrates it. Fast-fails when a Zig-side
        # regression breaks the core.
        working-directory: poc/android-core
        run: zig build --release=small
      - name: Report .so size
        working-directory: poc/android-core
        run: |
          if [ -f zig-out/lib/libsmithers_core.so ]; then
            ls -l zig-out/lib/libsmithers_core.so
            echo "size_bytes=$(stat -c%s zig-out/lib/libsmithers_core.so)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::libsmithers_core.so not emitted (NDK may not have been picked up)."
            ls -l zig-out/lib/ || true
          fi
      - name: Assemble debug APK
        working-directory: poc/android-core
        # Use `gradle` directly — no wrapper jar is checked in; the
        # setup-gradle action provides the binary on PATH.
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact (diagnostic)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-core-canary-apk
          path: poc/android-core/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # iOS device-slice build (no signing, no deploy). Proves the project is
  # shaped correctly for App Store builds ahead of 0125's signing work.
  # ---------------------------------------------------------------------------
  ios-device-build:
    name: iOS device-slice build (no signing)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - name: Install XcodeGen (pinned)
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o "${RUNNER_TEMP}/xcodegen.zip"
          unzip -q "${RUNNER_TEMP}/xcodegen.zip" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "$GITHUB_PATH"
      # project.yml links ghostty/zig-out/lib/ghostty-vt.xcframework and
      # libsmithers/zig-out/lib/libsmithers-ios.xcframework into SmithersiOS.
      # Both are build outputs, so build them (or restore them) first. The
      # cache keys match ios-testflight.yml.
      - name: Resolve iOS xcframework cache keys
        id: ios_cache_keys
        run: |
          set -euo pipefail
          ZIG_VERSION="$(cat .zigversion)"
          GHOSTTY_SHA="$(git -C ghostty rev-parse HEAD)"
          SCRIPT_HASH="$(shasum -a 256 poc/libghostty-ios/scripts/build-xcframework.sh | cut -d' ' -f1)"
          SRC_HASH="$(find libsmithers -type f \( -name '*.zig' -o -name '*.zon' -o -name '*.h' -o -path 'libsmithers/scripts/*' \) -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 shasum -a 256 \
            | shasum -a 256 \
            | cut -d' ' -f1)"
          echo "ghostty=ghostty-vt-xcframework-${ZIG_VERSION}-${GHOSTTY_SHA}-${SCRIPT_HASH}-xcode${XCODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "libsmithers=libsmithers-ios-xcframework-${ZIG_VERSION}-${SRC_HASH}-xcode${XCODE_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Restore ghostty-vt.xcframework cache
        id: ghostty_cache
        uses: actions/cache@v4
        with:
          path: ghostty/zig-out
          key: ${{ steps.ios_cache_keys.outputs.ghostty }}
      - name: Restore libsmithers-ios.xcframework cache
        id: libsmithers_cache
        uses: actions/cache@v4
        with:
          path: libsmithers/zig-out/lib/libsmithers-ios.xcframework
          key: ${{ steps.ios_cache_keys.outputs.libsmithers }}
      - name: Install Zig (pinned)
        if: steps.ghostty_cache.outputs.cache-hit != 'true' || steps.libsmithers_cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      # The universal ghostty build also emits GhosttyKit, which compiles
      # Ghostty's shaders; Xcode 26 ships the Metal compiler separately.
      - name: Ensure the Metal toolchain
        if: steps.ghostty_cache.outputs.cache-hit != 'true'
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Build ghostty-vt.xcframework
        if: steps.ghostty_cache.outputs.cache-hit != 'true'
        run: ./poc/libghostty-ios/scripts/build-xcframework.sh
      - name: Build libsmithers-ios.xcframework
        if: steps.libsmithers_cache.outputs.cache-hit != 'true'
        run: ./libsmithers/scripts/build-ios-xcframework.sh
      - name: Regenerate Xcode project
        run: xcodegen generate
      - name: Build SmithersiOS (device slice, no signing)
        run: |
          xcodebuild \
            -project SmithersGUI.xcodeproj \
            -scheme SmithersiOS \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
