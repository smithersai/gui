# ios-e2e.yml — full-stack XCUITest harness for the SmithersiOS app.
#
# Ticket: ios-e2e-harness. The harness needs `docker compose up` for the
# plue stack; see the preflight job below for what enabling it requires.
#
# Gating: this workflow is expensive (~10-15 min) because it spins the
# full plue stack, so it runs only on push-to-main and on PRs that
# explicitly target main. PRs to non-main branches SHOULD NOT run it.
# Commits on branches are not tested via this workflow — contributors
# can run it locally via `ios/scripts/run-e2e.sh`.
#
# Failure triage: on failure we upload the .xcresult bundle so engineers
# can download it and re-open in Xcode to inspect the failed assertion +
# the simulator screen recording XCUITest captures automatically.

name: iOS E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The harness clones the private smithersai/plue repository, so it needs
  # the PLUE_CHECKOUT_TOKEN secret. Without it the E2E job is skipped, not
  # failed. Enabling it also needs a runner with Docker: GitHub's arm64
  # macOS runners have no nested virtualization, so
  # docker/setup-docker-action cannot start a VM there.
  preflight:
    name: Check E2E prerequisites
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          PLUE_CHECKOUT_TOKEN: ${{ secrets.PLUE_CHECKOUT_TOKEN }}
        run: |
          if [ -n "${PLUE_CHECKOUT_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PLUE_CHECKOUT_TOKEN is not set; skipping the iOS E2E harness."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  ios-e2e:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    name: iOS E2E (iPhone 16 / iOS 18.6)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout gui
        uses: actions/checkout@v4
        with:
          path: gui

      # The E2E harness needs the plue checkout side-by-side with gui/.
      # CI clones the public mirror of smithers-orchestrator into ../plue.
      # Production keeps the two repos siblings on developer laptops
      # (see .smithers/specs/ios-and-remote-sandboxes.md).
      - name: Checkout plue
        uses: actions/checkout@v4
        with:
          repository: smithersai/plue
          path: plue
          token: ${{ secrets.PLUE_CHECKOUT_TOKEN }}
          persist-credentials: false

      - name: Install Xcode toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      # docker/setup-docker-action starts a Lima VM. It needs nested
      # virtualization, which GitHub's arm64 macOS runners lack.
      - name: Set up Docker (macOS)
        uses: docker/setup-docker-action@v4

      - name: Install Bun (for plue workflow-runtime build)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Pre-warm plue bun.lock
        working-directory: plue
        run: bun install || true

      - name: Run iOS E2E harness
        working-directory: gui
        env:
          PLUE_CHECKOUT: ${{ github.workspace }}/plue
          PLUE_BASE_URL: http://localhost:4000
          E2E_SIMULATOR_NAME: iPhone 16
          E2E_SIMULATOR_OS: "18.6"
          # The hosted runner environment is clean; no Rust-tooling env
          # vars to unset. The harness script unsets them defensively
          # anyway.
        run: ./ios/scripts/run-e2e.sh

      - name: Collect xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-xcresult
          path: gui/build/e2e-results-*.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Collect xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-xcodebuild-log
          path: gui/build/e2e-xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
